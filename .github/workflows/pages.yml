# Publishes the lab website (statuta.id) with GitHub Pages.
# Every push rebuilds the pages from the CSV to check that the build works.
# Deploying happens only on the default branch, and only once the repo
# variable PAGES_ENABLED is set to "true" (after DNS and Pages are set up).

name: Publish website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages from the CSV
        run: python3 scripts/build_map.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
