<style>
/* Layout: one narrow column, same look as the home page without the 3D scene.
   The note, then its links and backlinks, then a map of all notes. Dark only. */
:root {
  --bg: #0B0B0B; --ink: #F2F0EB; --muted: #9A968F; --line: rgba(242, 240, 235, .12); --red: #C8262E;
  --font: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.75; }
main { max-width: 680px; margin: 0 auto; padding: 40px 16px 64px; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 4px; }
a:hover, a:focus-visible { text-decoration-color: var(--red); color: #fff; outline: none; }
a.wikilink { color: #ffd7d9; text-decoration-color: var(--red); }
.crumb { color: var(--muted); font-size: 12px; margin: 0 0 40px; }
.crumb .lang { float: right; } .crumb .lang b { color: var(--ink); font-weight: 500; }
.muted { color: var(--muted); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 5vw, 38px); line-height: 1.15; margin: 4px 0 24px; }
h1::after { content: ""; display: block; width: 56px; height: 3px; background: var(--red); margin-top: 14px; transform: skewX(-30deg); }
h2 { font-size: 12px; font-weight: 400; color: var(--red); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
p { margin: 0 0 16px; max-width: 64ch; }
article { position: relative; padding-right: 72px; }
.rank { position: absolute; right: 0; top: -10px; font-family: var(--display); font-weight: 800; font-size: 96px; line-height: 1;
  color: transparent; -webkit-text-stroke: 1px rgba(200, 38, 46, .7); transform: rotate(-8deg); }
.ch { font-size: 12px; color: var(--red); letter-spacing: .08em; }
.connections { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
.refs { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
figure { margin: 40px 0 0; text-align: center; }
figcaption { color: var(--muted); font-size: 12px; margin-top: 8px; }
.graph { width: min(100%, 360px); height: auto; }
.graph .edge { stroke: rgba(242, 240, 235, .22); stroke-width: 1.2; }
.graph .edge.hot { stroke: var(--red); stroke-width: 2; }
.graph .node circle { fill: #151515; stroke: rgba(242, 240, 235, .5); stroke-width: 1.2; }
.graph .node text { fill: var(--ink); font-family: var(--display); font-weight: 800; font-size: 16px; }
.graph .node:hover circle, .graph .node:focus-visible circle { stroke: var(--red); stroke-width: 2; }
.graph .node.current circle { fill: var(--red); stroke: var(--red); }
.index { list-style: none; margin: 32px 0 0; padding: 0; display: grid; gap: 18px; }
.index a { display: grid; text-decoration: none; }
.index b { font-family: var(--display); font-size: 19px; }
.index a:hover b { color: #fff; text-decoration: underline; text-decoration-color: var(--red); }
.index .muted { font-size: 12px; }
.exp { padding-right: 0; margin: 24px 0 40px; padding-top: 24px; border-top: 1px solid var(--line); }
h1.small { font-size: clamp(22px, 4vw, 28px); margin-bottom: 20px; }
.exp h2, .page h2 { margin-top: 32px; }
.exp .refs, .page .refs { padding-left: 18px; list-style: disc; margin-bottom: 16px; gap: 10px; } .exp ol.refs { list-style: decimal; }
code { background: rgba(242, 240, 235, .08); padding: 0 4px; }
footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
@media (max-width: 520px) { .connections { grid-template-columns: 1fr; } article { padding-right: 48px; } .rank { font-size: 64px; } }
</style>
