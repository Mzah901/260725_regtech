<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ScreenStream</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #status { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); color:#ccc;
            font:18px/1.4 system-ui, sans-serif; text-align:center; pointer-events:none; padding:0 16px; }
  #hint { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); color:#fff; background:rgba(255,255,255,.15);
          font:15px system-ui, sans-serif; padding:10px 18px; border-radius:20px; pointer-events:none; transition:opacity .4s; }
  #stats { position:fixed; top:8px; left:8px; color:#0f0; background:rgba(0,0,0,.6); font:12px/1.4 ui-monospace, monospace;
           padding:6px 8px; border-radius:6px; white-space:pre; display:none; pointer-events:none; }
  body.fs { cursor:none; }
  body.fs #hint { opacity:0; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline disablepictureinpicture></video>
<div id="status">Connecting…</div>
<div id="hint">Tap to go full screen · double-tap for stats</div>
<div id="stats"></div>

<script>
const $ = (id) => document.getElementById(id);
const video = $('video');
const token = new URLSearchParams(location.search).get('k') || '';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let pc = null;

function setStatus(text) { $('status').textContent = text; $('status').style.display = text ? 'block' : 'none'; }

async function connect() {
  setStatus('Waiting for the Mac to start sharing…');
  const { id } = await (await fetch('/api/viewer/join?k=' + token, { method: 'POST' })).json();

  // Long-poll until the Mac sends us an offer.
  let offer = null;
  while (!offer) {
    const res = await fetch(`/api/viewer/offer?k=${token}&id=${id}`);
    if (res.status === 200) offer = await res.json();
    else if (res.status !== 204) throw new Error('server said ' + res.status);
  }

  pc = new RTCPeerConnection({ iceServers: [] });
  const myPc = pc;
  pc.addEventListener('track', (e) => {
    lowLatency(e.receiver);
    video.srcObject = e.streams[0] || new MediaStream([e.track]);
    video.play().catch(() => {});
  });
  pc.addEventListener('connectionstatechange', () => watchConnection(myPc));

  await pc.setRemoteDescription(offer);
  await pc.setLocalDescription(await pc.createAnswer());
  await gatheringDone(pc);
  await fetch('/api/viewer/answer?k=' + token, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, description: { type: 'answer', sdp: pc.localDescription.sdp } }),
  });
  setStatus('Connecting video…');
}

// Tell the browser to show frames immediately instead of buffering them "just in case".
// This is the biggest single latency win on the receiving side.
function lowLatency(receiver) {
  try { if ('jitterBufferTarget' in receiver) receiver.jitterBufferTarget = 0; } catch (e) {}
  try { receiver.playoutDelayHint = 0; } catch (e) {} // older Chrome name for the same thing
}

let disconnectTimer = null;
function watchConnection(myPc) {
  if (myPc !== pc) return;
  const state = pc.connectionState;
  clearTimeout(disconnectTimer);
  if (state === 'connected') setStatus('');
  if (state === 'disconnected') disconnectTimer = setTimeout(() => restart('Connection lost. Reconnecting…'), 4000);
  if (state === 'failed' || state === 'closed') restart('Connection lost. Reconnecting…');
}

let restarting = false;
async function restart(message) {
  if (restarting) return;
  restarting = true;
  if (pc) pc.close();
  pc = null;
  video.srcObject = null;
  setStatus(message);
  await sleep(1500);
  restarting = false;
  run();
}

async function run() {
  while (true) {
    try { await connect(); return; }
    catch (e) {
      setStatus('Can’t reach the Mac (' + e.message + '). Retrying…');
      await sleep(3000);
    }
  }
}

function gatheringDone(pc) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') resolve(); });
    setTimeout(resolve, 2000);
  });
}

// ---------- full screen, landscape, keep screen on ----------
async function goFullscreen() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    await screen.orientation.lock('landscape');
  } catch (e) { /* not supported on this device: fine */ }
  keepAwake();
}

let wakeLock = null;
async function keepAwake() {
  // Only works on https or if the address is allowed in chrome://flags (see README).
  try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wakeLock = null; keepAwake(); } });
document.addEventListener('fullscreenchange', () => document.body.classList.toggle('fs', !!document.fullscreenElement));

// Single tap = full screen. Double tap = toggle stats overlay.
let lastTap = 0;
document.addEventListener('click', () => {
  const now = Date.now();
  if (now - lastTap < 350) $('stats').style.display = $('stats').style.display === 'block' ? 'none' : 'block';
  lastTap = now;
  goFullscreen();
});

// ---------- stats overlay: lets you measure instead of guessing ----------
let prev = null;
setInterval(async () => {
  if (!pc || $('stats').style.display !== 'block') return;
  const report = await pc.getStats();
  let inbound = null, codec = '', rtt = null;
  report.forEach((s) => {
    if (s.type === 'inbound-rtp' && s.kind === 'video') inbound = s;
    if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') rtt = s.currentRoundTripTime;
  });
  if (!inbound) return;
  const c = report.get(inbound.codecId);
  if (c) codec = c.mimeType.replace('video/', '');
  let kbps = 0;
  if (prev) kbps = Math.round((inbound.bytesReceived - prev.bytesReceived) * 8 / (inbound.timestamp - prev.timestamp));
  const jb = inbound.jitterBufferEmittedCount ? Math.round(1000 * inbound.jitterBufferDelay / inbound.jitterBufferEmittedCount) : '?';
  $('stats').textContent =
    `${inbound.frameWidth || '?'}x${inbound.frameHeight || '?'} @ ${Math.round(inbound.framesPerSecond || 0)} fps  ${codec}\n` +
    `${(kbps / 1000).toFixed(1)} Mbps   network RTT ${rtt != null ? Math.round(rtt * 1000) + ' ms' : '?'}\n` +
    `jitter buffer ${jb} ms   lost ${inbound.packetsLost}   dropped ${inbound.framesDropped ?? '?'}`;
  prev = inbound;
}, 1000);

run();
</script>
</body>
</html>
